<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌐 Web to App Builder</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f8fa;
      padding: 40px;
      color: #222;
    }
    .container {
      max-width: 700px;
      background: white;
      margin: auto;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      background: #007bff;
      color: white;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: #0056b3; }
    .btn-success { background: #28a745; }
    .btn-success:hover { background: #218838; }
    #result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #e9f7ef;
      color: #155724;
      display: none;
      text-align: center;
      word-break: break-word;
    }
    a {
      color: #007bff;
      font-weight: bold;
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <h2 style="text-align:center;">🌐 Convert Your Website to App for FREE</h2>

    <form id="appForm" enctype="multipart/form-data">
      <input type="text" name="appName" placeholder="App Name *" required>
      <input type="text" name="packageName" placeholder="Package Name (e.g., com.myapp.app) *" required>
      <input type="text" name="versionName" placeholder="Version Name *" required>
      <input type="number" name="versionCode" placeholder="Version Code *" required>
      <select name="minSdk" required>
        <option value="">Select minSdk</option>
        <option value="21">21</option>
        <option value="29">29</option>
        <option value="34">34 (Android 14)</option>
      </select>
      <input type="url" name="websiteUrl" placeholder="Website URL *" required>
      <input type="file" name="icon" accept="image/*" required>
      <input type="file" name="splash" accept="image/*" required>
      <input type="email" name="email" placeholder="Email *" required>

      <button type="submit" class="btn-success">Generate Free APK</button>
    </form>

    <p style="text-align:center;margin:10px 0;">OR</p>
    <button id="payAAB">Generate AAB (₹6,999)</button>

    <div id="result"></div>
  </div>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    // 🌍 Backend URL (Change this when hosting)
    const BACKEND_URL = "http://localhost:5000";

    const form = document.getElementById("appForm");
    const resultBox = document.getElementById("result");

    // ✅ Free APK Generation
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      resultBox.style.display = "block";
      resultBox.innerHTML = "⏳ Generating APK...";

      const formData = new FormData(form);

      try {
        const res = await fetch(`${BACKEND_URL}/api/build`, {
          method: "POST",
          body: formData,
        });

        if (!res.ok) throw new Error("Server not responding");

        const data = await res.json();

        if (data.success) {
          resultBox.innerHTML = `
            ✅ Your APK is ready! <br><br>
            <a href="${data.downloadUrl}" target="_blank" download>⬇ Download Now</a>
          `;
        } else {
          resultBox.innerHTML = "❌ Build failed. Try again.";
        }
      } catch (error) {
        console.error("❌ Error:", error);
        resultBox.innerHTML = "⚠️ Connection error. Check backend server.";
      }
    });

    // ✅ Paid AAB Generation (to implement later)
    document.getElementById("payAAB").addEventListener("click", () => {
      alert("⚠️ Paid AAB generation will be available soon!");
    });
  </script>
</body>
</html>
