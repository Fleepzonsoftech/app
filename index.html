<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web to App Builder - Convert Website to App Free</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Poppins", sans-serif; }
    body { background: #f5f8fa; color: #222; line-height: 1.6; padding: 30px; }
    .container {
      max-width: 760px; margin: 0 auto; background: #fff; padding: 30px 40px;
      border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    h1 { text-align: center; color: #007bff; margin-bottom: 18px; }
    h2 { text-align: center; color: #333; margin: 20px 0 10px; }
    h3 { color: #007bff; margin-top: 20px; }
    p, ul { color: #444; font-size: 15px; }
    ul { list-style-type: none; }
    ul li::before { content: "✅ "; color: #007bff; }
    hr { margin: 25px 0; border: none; height: 1px; background: #eee; }

    form { display: flex; flex-direction: column; gap: 12px; }
    label { font-weight: 600; color: #333; }
    input[type="text"], input[type="number"], input[type="url"],
    input[type="file"], select, textarea, input[type="email"] {
      padding: 10px 12px; border-radius: 8px; border: 1px solid #ccc;
      transition: all 0.2s ease;
    }
    input:focus, textarea:focus, select:focus {
      border-color: #007bff; outline: none; box-shadow: 0 0 4px rgba(0, 123, 255, 0.2);
    }

    button {
      background: #007bff; color: #fff; border: none; padding: 12px;
      border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: 600;
      transition: background 0.3s ease;
    }
    button:hover { background: #0056b3; }
    .btn-success { background: #28a745; }
    .btn-success:hover { background: #1e7e34; }

    #result {
      margin-top: 25px; padding: 15px; border-radius: 10px;
      background: #e9f7ef; color: #155724; border: 1px solid #c3e6cb;
      text-align: center; display: none;
    }

    .search-section { text-align: center; margin-top: 40px; padding-top: 20px; border-top: 1px solid #eee; }
    .search-box { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .search-box input {
      padding: 10px 14px; width: 60%; border-radius: 8px; border: 1px solid #ccc; font-size: 15px; transition: 0.3s;
    }
    .search-box input:focus { border-color: #007bff; box-shadow: 0 0 4px rgba(0, 123, 255, 0.2); outline: none; }
    .search-results { margin-top: 20px; background: #f8f9fa; border-radius: 8px; padding: 15px; display: none; }
    .app-item { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
    .app-item:last-child { border-bottom: none; }
  </style>
</head>

<body>
  <div class="container">
    <h1>🌐 Convert Your Website to App for FREE</h1>
    <p style="text-align:center; color:#555; margin-bottom: 25px;">
      Convert your website into a mobile app — <strong>no coding needed!</strong><br>
      Fill in your app details and generate an APK instantly or a Play Store-ready AAB.
    </p>

    <hr>

    <form id="appForm" enctype="multipart/form-data">
      <label>App Name *</label>
      <input type="text" name="appName" required>

      <label>Package Name *</label>
      <input type="text" name="packageName" required>

      <label>Version Name *</label>
      <input type="text" name="versionName" required>

      <label>Version Code *</label>
      <input type="number" name="versionCode" required>

      <label>minSdk *</label>
      <select name="minSdk" required>
        <option value="">-- Select SDK --</option>
        <option value="21">21</option>
        <option value="23">23</option>
        <option value="26">26</option>
        <option value="29">29</option>
        <option value="34">34 (Android 14)</option>
      </select>

      <label>Website URL *</label>
      <input type="url" name="websiteUrl" required>

      <label>App Icon *</label>
      <input type="file" name="icon" accept="image/*" required>

      <label>Splash Image *</label>
      <input type="file" name="splash" accept="image/*" required>

      <label>Contact Email *</label>
      <input type="email" name="email" required>

      <hr>
      <button type="submit" class="btn-success">Generate Free APK</button>
      <p style="text-align:center; margin:12px 0; font-weight:600;">OR</p>
      <button type="button" id="payAAB">Generate AAB (₹6,999)</button>
    </form>

    <div id="result"></div>
  </div>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    const form = document.getElementById("appForm");
    const resultBox = document.getElementById("result");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      resultBox.style.display = "block";
      resultBox.innerHTML = "⏳ Generating your APK...";

      const formData = new FormData(form);
      formData.append("generateType", "apk");

      try {
        const res = await fetch("http://localhost:5000/api/submit", {
          method: "POST",
          body: formData,
        });
        const data = await res.json();

        if (data.success) {
          resultBox.innerHTML = `
            ✅ Your APK is ready!<br>
            <a href="${data.downloadUrl}" download style="color:#007bff;font-weight:600;">⬇ Download Now</a>
          `;
        } else {
          resultBox.innerHTML = "❌ Build failed. Try again.";
        }
      } catch (err) {
        resultBox.innerHTML = "⚠️ Server not reachable.";
        console.error(err);
      }
    });

    document.getElementById("payAAB").addEventListener("click", function() {
      const options = {
        key: "rzp_test_1234567890",
        amount: 699900,
        currency: "INR",
        name: "Web to App Builder",
        description: "AAB Generation Fee",
        handler: async function (response) {
          alert("✅ Payment successful: " + response.razorpay_payment_id);
          const formData = new FormData(form);
          formData.append("generateType", "aab");
          const res = await fetch("http://localhost:5000/api/submit", {
            method: "POST",
            body: formData,
          });
          const data = await res.json();
          if (data.success) {
            resultBox.style.display = "block";
            resultBox.innerHTML = `
              ✅ Your AAB is ready!<br>
              <a href="${data.downloadUrl}" download style="color:#007bff;font-weight:600;">⬇ Download Now</a>
            `;
          }
        },
        theme: { color: "#007bff" }
      };
      new Razorpay(options).open();
    });
  </script>
</body>
</html>
